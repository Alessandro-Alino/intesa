<!-- Sezione Pipeline / Step Azure -->
<section class="azure-section" id="azurePipelineSection">

  <!-- Step 1: Autenticazione ed Accesso ad Azure -->
  <div class="step-card" id="stepAzureAuth">
    <div class="step-header">
      <div class="step-number">1</div>
      <div class="step-info">
        <h3>Test Azure</h3>
        <p>Verifica le credenziali (Service Principal / Default Azure Credential) e ottiene un token di autenticazione.
        </p>
      </div>
      <div class="step-action">
        <!-- Upload Button -->
        <button id="btnUpload" class="primary-btn" type="button">Avvia Test Azure</button>
      </div>
      <div class="step-status">
        <span id="azureAuthStatus" class="status-badge status-pending">In attesa</span>
      </div>
    </div>

    <!-- Dettagli Risultato dello Step -->
    <div id="azureAuthDetails" class="step-details">
      <div id="azureAuthMessage" class="step-message"></div>
    </div>
  </div>

</section>
